advanced:
  embeddings: false
  llm: false
  xgboost: false
dataset:
  path: data/sample/sample_resumes.csv
  target: job_role
features:
  tfidf:
    enabled: true
    max_df: 1.0
    max_features: 10000
    min_df: 1
    ngram_range:
    - 1
    - 2
model:
  metric: f1
  random_state: 42
  strategy: auto
paths:
  data_dir: data
  models_dir: models
  outputs_dir: outputs
task:
  type: classification
text:
  columns:
  - resume_text
training:
  cv_folds: 3
  test_size: 0.2
